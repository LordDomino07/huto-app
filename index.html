<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hűtő Rendszerező</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding-bottom: 30px; color: #1e293b; }
        header { background: #1e40af; color: white; padding: 15px; text-align: center; }
        .cloud-bar { background: #e0f2fe; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #bae6fd; }
        .cloud-inputs { display: flex; gap: 8px; }
        .cloud-inputs input { flex: 1; padding: 8px; border: 1px solid #93c5fd; border-radius: 6px; }
        .cloud-btn { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .storage-toggle { display: flex; background: #e2e8f0; margin: 15px; border-radius: 12px; padding: 4px; }
        .toggle-btn { flex: 1; padding: 12px; border: none; background: transparent; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: #64748b; }
        .toggle-btn.active-fridge { background: #2563eb; color: white; }
        .toggle-btn.active-freezer { background: #0284c7; color: white; }
        .container { padding: 0 15px; max-width: 600px; margin: 0 auto; }
        .actions { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-add { flex: 2; background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-sync { flex: 1; background: #f59e0b; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; }
        .item-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .btn-icon { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 15px; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-save { background: #2563eb; color: white; }
        .btn-cancel { background: #e2e8f0; }
    </style>
</head>
<body>
    <header>
        <h1>🧊 Hűtő & Fagyasztó Rendszerező</h1>
    </header>
    <div class="cloud-bar">
        <strong id="cloudStatus">☁️ Csatlakozásra vár</strong>
        <div class="cloud-inputs">
            <input type="text" id="familyNameInput" placeholder="Családi Név (pl. Torma-Balogh)">
            <button class="cloud-btn" onclick="connectCloud()">Csatlakozás</button>
        </div>
    </div>
    <div class="storage-toggle">
        <button id="fridgeTab" class="toggle-btn active-fridge" onclick="switchStorage('fridge')">🥦 Hűtő</button>
        <button id="freezerTab" class="toggle-btn" onclick="switchStorage('freezer')">❄️ Fagyasztó</button>
    </div>
    <div class="container">
        <div class="actions">
            <button class="btn-add" onclick="openModal()">➕ Új Elem</button>
            <button class="btn-sync" onclick="fetchFromCloud()">🔄 Frissítés</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Keresés..." oninput="renderItems()">
        <div id="itemList"></div>
    </div>
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h2>Új Elem</h2>
            <form id="itemForm" onsubmit="saveItem(event)">
                <div class="form-group"><label>Megnevezés</label><input type="text" id="itemName" required></div>
                <div class="form-group"><label>Tároló</label><select id="itemStorage"><option value="fridge">Hűtő</option><option value="freezer">Fagyasztó</option></select></div>
                <div class="form-group"><label>Mennyiség</label><input type="number" id="itemQty" step="0.1" value="1" required></div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Mégse</button>
                    <button type="submit" class="btn-save">Mentés</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let items = JSON.parse(localStorage.getItem('my_inventory') || '[]');
        let currentStorage = 'fridge';
        let familyName = localStorage.getItem('family_name') || '';

        window.onload = function() {
            if (familyName) {
                document.getElementById('familyNameInput').value = familyName;
                document.getElementById('cloudStatus').innerText = '☁️ Csatlakozva: ' + familyName;
                fetchFromCloud();
            } else {
                renderItems();
            }
        };

        async function connectCloud() {
            const inputVal = document.getElementById('familyNameInput').value.trim();
            if (!inputVal) { alert('Adj meg nevet!'); return; }
            familyName = inputVal;
            localStorage.setItem('family_name', familyName);
            document.getElementById('cloudStatus').innerText = '☁️ Csatlakozva: ' + familyName;
            await fetchFromCloud();
        }

        async function saveToCloud() {
            if (!familyName) return;
            try {
                const binKey = 'huto_' + btoa(unescape(encodeURIComponent(familyName))).replace(/=/g, '');
                const getRes = await fetch(`https://api.jsonbin.io/v3/b?name=${binKey}`);
                if (getRes.ok) {
                    const listData = await getRes.json();
                    if (listData && listData.length > 0) {
                        await fetch(`https://api.jsonbin.io/v3/b/${listData[0].id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(items)
                        });
                        return;
                    }
                }
                await fetch(`https://api.jsonbin.io/v3/b`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Bin-Name': binKey, 'X-Private': 'false' },
                    body: JSON.stringify(items)
                });
            } catch (err) { console.log(err); }
        }

        async function fetchFromCloud() {
            if (!familyName) { renderItems(); return; }
            try {
                document.getElementById('cloudStatus').innerText = '🔄 Frissítés...';
                const binKey = 'huto_' + btoa(unescape(encodeURIComponent(familyName))).replace(/=/g, '');
                const res = await fetch(`https://api.jsonbin.io/v3/b?name=${binKey}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0 && data[0].record) {
                        items = data[0].record;
                        localStorage.setItem('my_inventory', JSON.stringify(items));
                    }
                }
                document.getElementById('cloudStatus').innerText = '☁️ Csatlakozva: ' + familyName;
            } catch (err) {
                document.getElementById('cloudStatus').innerText = '☁️ Csatlakozva (Helyi)';
            }
            renderItems();
        }

        function switchStorage(storage) {
            currentStorage = storage;
            document.getElementById('fridgeTab').className = storage === 'fridge' ? 'toggle-btn active-fridge' : 'toggle-btn';
            document.getElementById('freezerTab').className = storage === 'freezer' ? 'toggle-btn active-freezer' : 'toggle-btn';
            renderItems();
        }

        function renderItems() {
            const list = document.getElementById('itemList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => item.storage === currentStorage && item.name.toLowerCase().includes(search));
            if (filtered.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: #64748b; margin-top: 30px;">Nincs elem.</p>`;
                return;
            }
            list.innerHTML = filtered.map(item => `
                <div class="item-card">
                    <div>
                        <h3>${item.name}</h3>
                        <div style="font-size: 0.85rem; color: #64748b;">${item.qty} db</div>
                    </div>
                    <button class="btn-icon btn-delete" onclick="deleteItem(${item.id})">🗑️</button>
                </div>
            `).join('');
        }

        function openModal() { document.getElementById('itemModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('itemModal').style.display = 'none'; document.getElementById('itemForm').reset(); }

        async function saveItem(e) {
            e.preventDefault();
            items.push({
                id: Date.now(),
                name: document.getElementById('itemName').value,
                storage: document.getElementById('itemStorage').value,
                qty: parseFloat(document.getElementById('itemQty').value)
            });
            localStorage.setItem('my_inventory', JSON.stringify(items));
            closeModal();
            renderItems();
            await saveToCloud();
        }

        async function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            localStorage.setItem('my_inventory', JSON.stringify(items));
            renderItems();
            await saveToCloud();
        }
    </script>
</body>
</html>
